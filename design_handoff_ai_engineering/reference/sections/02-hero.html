      <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:28px 0 0">

          <a href="#rebuild" style="display:flex; align-items:center; height:46px; padding:0 24px; border:1px solid var(--line); background:rgba(255,255,255,0.85); border-radius:6px; font-size:15px; letter-spacing:-0.01em" style-hover="border-color:var(--a); color:var(--a)">See the process</a>
        </div>
